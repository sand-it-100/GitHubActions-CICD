
name: Java Docker CI CD Pipeline

on:
  push:
    branches: [ "main" ]

  pull_request:
    branches: [ "main" ]

jobs:
  build-test-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # Step 1: Download source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Setup Java and Maven
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Step 3: Build and test application
      - name: Build with Maven
        run: mvn -B clean verify

      # Step 4: Login to Docker Hub
      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 5: Setup Docker Buildx
      - name: Setup Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v4

      # Step 6: Build and push Docker image
      - name: Build and Push Docker Image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/githubactions-cicd:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/githubactions-cicd:${{ github.sha }}

      # Step 7: Deploy application on Render
      - name: Deploy to Render
        if: github.event_name == 'push'
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "Render deploy hook not configured yet."
          else
            curl --fail --silent --show-error \
              --request POST "$RENDER_DEPLOY_HOOK"
          fi
